[env]
platform = ststm32
board = blackpill_f411ce
framework = cmsis
upload_protocol = serial
upload_speed = 115200
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes

; [env:foldername]
; build_src_filter = ${env.build_src_filter} +<foldername/>

[env:0_clock]
build_src_filter = +<0_clock/>

[env:1_blink]
build_src_filter = +<1_blink/>

[env:2_ext_interrupt]
build_src_filter = +<2_ext_interrupt/>

[env:3_adc_polling]
build_src_filter = +<3_adc_polling/>

[env:4_adc_interrupt]
build_src_filter = +<4_adc_interrupt/>

[env:5_timer_blink]
build_src_filter = +<5_timer_blink/>

[env:6_timer_pwm]
build_src_filter = +<6_timer_pwm/>